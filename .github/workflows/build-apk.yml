name: Build FluxoPlus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sincronizar versão 1.1.9
        run: |
          sed -i 's/private static final String APP_VERSION="[0-9.]*";/private static final String APP_VERSION="1.1.9";/' app/src/main/java/com/aznup/fluxoplus/MainActivity.java
          sed -i -E 's/Versão [0-9]+\.[0-9]+\.[0-9]+/Versão 1.1.9/g; s/>[0-9]+\.[0-9]+\.[0-9]+</>1.1.9</g' app/src/main/assets/index.html
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FluxoPlus-1.1.9.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FluxoPlus-APK-1.1.9
          path: FluxoPlus-1.1.9.apk
          retention-days: 30
