plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aznup.fluxoplus'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aznup.fluxoplus'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.1.7'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
